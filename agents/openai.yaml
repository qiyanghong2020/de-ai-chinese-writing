interface:
  display_name: "去 AI 腔"
  short_description: "把中英文论文、翻译稿、邮件、申请信和长文改得更自然具体，减少模板味、机器抛光感和 ChatGPT 腔"
  default_prompt: "Use $de-ai-writing to rewrite this Chinese or English draft so it sounds natural, specific, authorial, and genre-appropriate while preserving meaning, facts, logic, citations, and evidence boundaries. Choose the Chinese or English language lane and the right edit lens: academic manuscript polish, translation naturalization, tone and clarity, expression variants, brevity, long-form style, or humanizer-caution. Remove stock transitions and machine-smoothed phrasing, keep concrete subjects and verbs, preserve the writer's register or English variety, and avoid inventing examples, data, citations, emotion, or personal voice. Do not chase AI detector scores, promise detector evasion, or add mistakes as camouflage."
