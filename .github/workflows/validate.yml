name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run repository contract tests
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify Agent Skills discovery
        run: npx --yes skills add . --list
